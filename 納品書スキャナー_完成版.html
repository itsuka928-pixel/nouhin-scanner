<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f5f2ed">
<title>納品書スキャナー</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2ed;
    --surface: #ffffff;
    --surface2: #f0ede8;
    --card: #ffffff;
    --border: #e0dcd6;
    --border2: #c8c3bb;
    --text: #1a1916;
    --text2: #6b6760;
    --text3: #9e9a94;
    --accent: #2563eb;
    --accent-bg: #eff6ff;
    --green: #16a34a;
    --green-bg: #f0fdf4;
    --green-border: #bbf7d0;
    --amber: #d97706;
    --amber-bg: #fffbeb;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --red-border: #fecaca;
    --r: 14px;
    --r-sm: 8px;
    --sans: 'Noto Sans JP', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* ── Header ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-icon {
    width: 34px; height: 34px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .header-title { font-size: 15px; font-weight: 700; }
  .header-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .free-pill {
    background: var(--green-bg);
    color: var(--green);
    border: 1px solid var(--green-border);
    border-radius: 20px;
    font-size: 11px; font-weight: 700;
    padding: 4px 10px;
  }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 58px;
    z-index: 99;
  }
  .tab {
    flex: 1; padding: 11px 8px;
    border: none; background: transparent;
    font-family: var(--sans); font-size: 13px;
    color: var(--text3); cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
  .badge {
    background: var(--surface2); color: var(--text3);
    border: 1px solid var(--border);
    border-radius: 12px; font-size: 10px;
    padding: 1px 6px; transition: all 0.2s;
  }
  .badge.lit { background: var(--accent); color: white; border-color: var(--accent); }

  /* ── Content ── */
  .content { padding: 16px 16px 100px; max-width: 480px; margin: 0 auto; }

  /* ── Store selector ── */
  .store-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 12px 14px;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .store-label { font-size: 12px; color: var(--text3); white-space: nowrap; }
  .store-select {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 7px 10px;
    font-family: var(--sans); font-size: 14px; font-weight: 500;
    color: var(--text); background: var(--surface2);
    outline: none; cursor: pointer;
  }
  .store-select:focus { border-color: var(--accent); }

  /* ── Upload ── */
  .upload-zone {
    border: 2px dashed var(--border2);
    border-radius: var(--r);
    padding: 36px 20px;
    text-align: center;
    background: var(--surface);
    position: relative; cursor: pointer;
    transition: all 0.2s;
  }
  .upload-zone:active { background: var(--accent-bg); border-color: var(--accent); }
  .upload-zone input {
    position: absolute; inset: 0; opacity: 0;
    width: 100%; height: 100%; cursor: pointer; font-size: 0;
  }
  .upload-emoji { font-size: 44px; margin-bottom: 14px; display: block; }
  .upload-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .upload-desc { font-size: 13px; color: var(--text2); line-height: 1.7; }
  .upload-hint { font-size: 11px; color: var(--text3); margin-top: 8px; }

  .divider {
    display: flex; align-items: center; gap: 12px; margin: 14px 0;
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .divider span { font-size: 12px; color: var(--text3); }

  .cam-btn {
    width: 100%; padding: 15px;
    border: 1.5px solid var(--border2);
    border-radius: var(--r);
    background: var(--surface);
    font-family: var(--sans); font-size: 15px; font-weight: 700;
    color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    position: relative; transition: background 0.15s;
  }
  .cam-btn:active { background: var(--surface2); }
  .cam-btn input {
    position: absolute; inset: 0; opacity: 0;
    width: 100%; height: 100%; cursor: pointer; font-size: 0;
  }

  /* ── Preview ── */
  .preview-box {
    border-radius: var(--r); overflow: hidden;
    background: var(--surface2); border: 1px solid var(--border);
    position: relative; margin-bottom: 12px;
  }
  .preview-box img { width: 100%; max-height: 260px; object-fit: contain; display: block; }
  .preview-close {
    position: absolute; top: 10px; right: 10px;
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.9);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer;
  }
  .preview-name { padding: 8px 12px; font-size: 11px; color: var(--text3); border-top: 1px solid var(--border); }

  /* ── Buttons ── */
  .btn-row { display: flex; gap: 10px; }
  .btn {
    flex: 1; padding: 14px;
    border-radius: var(--r);
    font-family: var(--sans); font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
    border: 1px solid var(--border); text-align: center;
  }
  .btn:active { transform: scale(0.97); }
  .btn-main { background: var(--accent); color: white; border-color: var(--accent); }
  .btn-main:active { opacity: 0.88; }
  .btn-sub { background: var(--surface); color: var(--text2); }

  /* ── Loading ── */
  .loading-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 32px 20px; text-align: center;
  }
  .spinner {
    width: 44px; height: 44px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-label { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
  .loading-sub { font-size: 12px; color: var(--text3); }

  /* ── Result ── */
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    overflow: hidden; margin-bottom: 12px;
  }
  .result-head {
    padding: 11px 14px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .result-head-lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); }
  .saved-pill {
    font-size: 11px; font-weight: 700;
    padding: 3px 10px;
    background: var(--green-bg); color: var(--green);
    border: 1px solid var(--green-border); border-radius: 20px;
  }
  .sheet-pill {
    font-size: 11px; font-weight: 700;
    padding: 3px 10px;
    background: var(--accent-bg); color: var(--accent);
    border: 1px solid #bfdbfe; border-radius: 20px;
  }

  .meta-grid { display: grid; grid-template-columns: auto 1fr; }
  .mk { padding: 9px 14px; font-size: 12px; color: var(--text3); border-bottom: 1px solid var(--border); display: flex; align-items: center; white-space: nowrap; }
  .mv { padding: 9px 14px; font-size: 14px; font-weight: 500; border-bottom: 1px solid var(--border); word-break: break-word; }

  .items-wrap { border-top: 1px solid var(--border); }
  .items-head { padding: 9px 14px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); background: var(--surface2); border-bottom: 1px solid var(--border); }
  .item-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--border); align-items: start; }
  .item-row:last-child { border-bottom: none; }
  .item-name { font-size: 14px; }
  .item-detail { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .item-amount { font-size: 14px; font-weight: 700; text-align: right; white-space: nowrap; }
  .total-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: var(--surface2); border-top: 1px solid var(--border); }
  .total-lbl { font-size: 12px; font-weight: 500; color: var(--text2); }
  .total-amt { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }

  .scan-again {
    width: 100%; padding: 14px;
    border: 2px dashed var(--border2); border-radius: var(--r);
    background: transparent; font-family: var(--sans);
    font-size: 15px; color: var(--text2); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.15s; margin-top: 10px;
  }
  .scan-again:active { border-color: var(--accent); color: var(--accent); }

  /* ── Error ── */
  .err-box {
    background: var(--red-bg); border: 1px solid var(--red-border);
    border-radius: var(--r); padding: 14px 16px;
    font-size: 13px; color: var(--red); line-height: 1.7;
    margin-top: 12px;
  }

  /* ── Records ── */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 12px; text-align: center;
  }
  .stat-n { font-size: 24px; font-weight: 700; letter-spacing: -0.04em; color: var(--accent); }
  .stat-n.sm { font-size: 16px; }
  .stat-l { font-size: 11px; color: var(--text3); margin-top: 3px; }

  .sec-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .sec-lbl { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); }
  .mini-btn {
    padding: 5px 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    font-family: var(--sans); font-size: 12px; color: var(--text2);
    cursor: pointer; transition: background 0.15s;
  }
  .mini-btn:active { background: var(--surface2); }

  .rec-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); overflow: hidden; margin-bottom: 10px;
  }
  .rec-top {
    padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; gap: 12px; transition: background 0.15s;
  }
  .rec-top:active { background: var(--surface2); }
  .rec-supplier { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
  .rec-meta { font-size: 11px; color: var(--text3); }
  .rec-amt { font-size: 16px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .rec-chev { font-size: 10px; color: var(--text3); transition: transform 0.2s; margin-left: 4px; }
  .rec-chev.open { transform: rotate(180deg); }
  .rec-body { border-top: 1px solid var(--border); padding: 12px 14px; display: none; }
  .rec-body.open { display: block; }
  .rec-items { font-size: 12px; color: var(--text2); line-height: 2; margin-bottom: 10px; }
  .rec-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .del-btn {
    padding: 5px 12px; background: var(--red-bg);
    border: 1px solid var(--red-border); border-radius: var(--r-sm);
    font-family: var(--sans); font-size: 12px; color: var(--red); cursor: pointer;
  }
  .store-tag {
    display: inline-block; font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 10px;
    background: var(--accent-bg); color: var(--accent);
    border: 1px solid #bfdbfe; margin-left: 6px;
  }

  .empty { text-align: center; padding: 48px 20px; }
  .empty-icon { font-size: 44px; margin-bottom: 14px; display: block; }
  .empty-txt { font-size: 14px; color: var(--text3); line-height: 1.9; }

  /* ── Settings ── */
  .set-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); overflow: hidden; margin-bottom: 14px;
  }
  .set-row {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
  }
  .set-row:last-child { border-bottom: none; }
  .set-lbl { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
  .set-sub { font-size: 12px; color: var(--text3); margin-bottom: 10px; }
  .set-input {
    width: 100%; border: 1px solid var(--border); border-radius: var(--r-sm);
    padding: 9px 12px; font-family: var(--sans); font-size: 13px;
    color: var(--text); background: var(--surface2); outline: none;
  }
  .set-input:focus { border-color: var(--accent); }
  .set-save {
    margin-top: 8px; padding: 8px 16px;
    background: var(--accent); color: white; border: none;
    border-radius: var(--r-sm); font-family: var(--sans);
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .set-ok { font-size: 12px; color: var(--green); margin-top: 6px; display: none; }

  .stores-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .store-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    font-size: 13px;
  }
  .store-del { background: transparent; border: none; color: var(--text3); font-size: 16px; cursor: pointer; }
  .store-add-row { display: flex; gap: 8px; }
  .store-add-input {
    flex: 1; border: 1px solid var(--border); border-radius: var(--r-sm);
    padding: 8px 10px; font-family: var(--sans); font-size: 13px;
    color: var(--text); background: var(--surface2); outline: none;
  }
  .store-add-btn {
    padding: 8px 14px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    font-family: var(--sans); font-size: 13px; cursor: pointer;
  }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text); color: white;
    padding: 10px 22px; border-radius: 20px;
    font-size: 13px; font-weight: 700;
    z-index: 999; white-space: nowrap; pointer-events: none;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-icon">📄</div>
    <div>
      <div class="header-title">納品書スキャナー</div>
      <div class="header-sub">Gemini AI + スプレッドシート連携</div>
    </div>
  </div>
  <div class="free-pill">無料</div>
</div>

<div class="tabs">
  <button class="tab active" id="t-scan" onclick="sw('scan')">📷 スキャン</button>
  <button class="tab" id="t-records" onclick="sw('records')">📋 履歴 <span class="badge" id="badge">0</span></button>
  <button class="tab" id="t-settings" onclick="sw('settings')">⚙️ 設定</button>
</div>

<!-- ── SCAN ── -->
<div id="tab-scan" class="content">
  <div class="store-bar">
    <div class="store-label">店舗：</div>
    <select class="store-select" id="store-sel"></select>
  </div>

  <div id="up-zone">
    <div class="upload-zone">
      <input type="file" id="file-in" accept="image/*" onchange="onFile(event)">
      <span class="upload-emoji">🗂</span>
      <div class="upload-title">納品書をアップロード</div>
      <div class="upload-desc">納品書・請求書・伝票の<br>写真を選択してください</div>
      <div class="upload-hint">JPG · PNG · HEIC · WebP</div>
    </div>
    <div class="divider"><span>または</span></div>
    <div class="cam-btn">
      <input type="file" id="cam-in" accept="image/*" capture="environment" onchange="onFile(event)">
      📷 カメラで今すぐ撮影
    </div>
  </div>

  <div id="prev-zone" style="display:none;">
    <div class="preview-box">
      <img id="prev-img" src="" alt="">
      <div class="preview-close" onclick="reset()">✕</div>
      <div class="preview-name" id="prev-name"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-sub" onclick="reset()">やり直す</button>
      <button class="btn btn-main" onclick="startScan()">✦ AI解析する</button>
    </div>
  </div>

  <div id="load-zone" style="display:none; margin-top: 14px;">
    <div class="loading-box">
      <div class="spinner"></div>
      <div class="loading-label" id="load-lbl">AIが解析中...</div>
      <div class="loading-sub" id="load-sub">フォーマットを自動検出しています</div>
    </div>
  </div>

  <div id="err-zone" style="display:none;"></div>
  <div id="res-zone" style="display:none; margin-top: 4px;"></div>
</div>

<!-- ── RECORDS ── -->
<div id="tab-records" class="content" style="display:none;">
  <div id="rec-content"></div>
</div>

<!-- ── SETTINGS ── -->
<div id="tab-settings" class="content" style="display:none;">
  <div class="set-section">
    <div class="set-row">
      <div class="set-lbl">Gemini APIキー</div>
      <div class="set-sub">aistudio.google.com で取得した無料キー</div>
      <input type="password" class="set-input" id="gemini-key" placeholder="AIza..." autocomplete="off">
      <button class="set-save" onclick="saveKey()">保存</button>
      <div class="set-ok" id="key-ok">✓ 設定済み</div>
    </div>
  </div>

  <div class="set-section">
    <div class="set-row">
      <div class="set-lbl">店舗名を管理</div>
      <div class="set-sub">スキャン時に選択できる店舗名</div>
      <div class="stores-list" id="stores-list"></div>
      <div class="store-add-row">
        <input type="text" class="store-add-input" id="new-store" placeholder="例：渋谷店">
        <button class="store-add-btn" onclick="addStore()">追加</button>
      </div>
    </div>
  </div>

  <div class="set-section">
    <div class="set-row">
      <div class="set-lbl">スプレッドシート連携</div>
      <div class="set-sub" style="color: var(--green);">✓ 設定済み（5店舗共有）</div>
    </div>
    <div class="set-row">
      <div class="set-lbl">保存データ</div>
      <div class="set-sub" id="data-count-lbl">0件</div>
      <button class="set-save" style="background: var(--surface2); color: var(--text2); border: 1px solid var(--border);" onclick="exportCSV()">CSVで出力</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Config（固定値）──
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzxlEcF4VRgSjRlKYcGd-hS7upweDEoVX6Fm2qvstzBQ9OrlImsB_Gb_JhPQ7ymim3ouA/exec';
const SKEY = 'nouhin_v2';

// ── Storage ──
function getData() { try { return JSON.parse(localStorage.getItem(SKEY) || '{"records":[],"stores":["本店","1号店","2号店","3号店","4号店"]}'); } catch(e) { return {records:[], stores:['本店']}; } }
function setData(d) { localStorage.setItem(SKEY, JSON.stringify(d)); }
function getKey() { return localStorage.getItem('gemini_key') || ''; }
function saveKey() {
  const v = document.getElementById('gemini-key').value.trim();
  if (!v) { toast('APIキーを入力してください'); return; }
  localStorage.setItem('gemini_key', v);
  document.getElementById('key-ok').style.display = 'block';
  toast('APIキーを保存しました ✓');
}

// ── Stores ──
function getStores() { return getData().stores || ['本店']; }
function renderStoreSelect() {
  const stores = getStores();
  const sel = document.getElementById('store-sel');
  const cur = sel.value;
  sel.innerHTML = stores.map(s => `<option value="${s}">${s}</option>`).join('');
  if (cur && stores.includes(cur)) sel.value = cur;
}
function renderStoresList() {
  const stores = getStores();
  document.getElementById('stores-list').innerHTML = stores.map((s,i) => `
    <div class="store-item">
      <span>${s}</span>
      <button class="store-del" onclick="removeStore(${i})">×</button>
    </div>
  `).join('');
}
function addStore() {
  const v = document.getElementById('new-store').value.trim();
  if (!v) return;
  const d = getData(); d.stores.push(v); setData(d);
  document.getElementById('new-store').value = '';
  renderStoreSelect(); renderStoresList();
  toast(v + 'を追加しました');
}
function removeStore(i) {
  const d = getData(); d.stores.splice(i,1); setData(d);
  renderStoreSelect(); renderStoresList();
}

// ── Tabs ──
function sw(t) {
  ['scan','records','settings'].forEach(x => {
    document.getElementById('tab-' + x).style.display = x === t ? '' : 'none';
    document.getElementById('t-' + x).classList.toggle('active', x === t);
  });
  if (t === 'records') renderRecs();
  if (t === 'settings') initSettings();
}
function updateBadge() {
  const n = getData().records.length;
  const b = document.getElementById('badge');
  b.textContent = n;
  b.className = 'badge' + (n > 0 ? ' lit' : '');
}

// ── File ──
let curB64 = null, curMime = null, curName = null;
function onFile(e) {
  const f = e.target.files[0]; if (!f) return;
  curMime = f.type || 'image/jpeg'; curName = f.name;
  const r = new FileReader();
  r.onload = ev => {
    curB64 = ev.target.result.split(',')[1];
    document.getElementById('prev-img').src = ev.target.result;
    document.getElementById('prev-name').textContent = f.name + ' (' + Math.round(f.size/1024) + ' KB)';
    document.getElementById('up-zone').style.display = 'none';
    document.getElementById('prev-zone').style.display = '';
    document.getElementById('res-zone').style.display = 'none';
    document.getElementById('err-zone').style.display = 'none';
    document.getElementById('load-zone').style.display = 'none';
  };
  r.readAsDataURL(f); e.target.value = '';
}
function reset() {
  curB64 = null;
  document.getElementById('up-zone').style.display = '';
  document.getElementById('prev-zone').style.display = 'none';
  document.getElementById('load-zone').style.display = 'none';
  document.getElementById('res-zone').style.display = 'none';
  document.getElementById('err-zone').style.display = 'none';
}

// ── Scan ──
async function startScan() {
  const key = getKey();
  if (!key) { sw('settings'); toast('先にAPIキーを設定してください'); return; }
  if (!curB64) return;

  const store = document.getElementById('store-sel').value;

  document.getElementById('prev-zone').style.display = 'none';
  document.getElementById('load-zone').style.display = '';
  document.getElementById('err-zone').style.display = 'none';
  document.getElementById('res-zone').style.display = 'none';
  setLoadMsg('Gemini AIが解析中...', 'フォーマットを自動検出しています');

  const prompt = `この納品書・請求書・伝票の画像を解析して、以下のJSON形式でデータを抽出してください。フォーマットがバラバラでも最大限情報を拾ってください。

{
  "supplier": "仕入先・発行元の会社名",
  "buyer": "納品先・宛先の会社名",
  "date": "YYYY-MM-DD形式の日付",
  "invoice_number": "伝票番号・注文番号",
  "items": [
    {
      "name": "商品名・品名",
      "quantity": 数量（数値、不明なら1）,
      "unit": "単位（個・本・枚・箱等）",
      "unit_price": 単価（数値、不明なら0）,
      "amount": 金額（数値、不明なら0）
    }
  ],
  "subtotal": 小計（数値、なければ0）,
  "tax": 消費税額（数値、なければ0）,
  "total": 合計金額（数値）,
  "notes": "備考があれば"
}

JSONのみ返してください。説明文・コードブロック記号は不要です。不明な項目は null または 0 にしてください。`;

  try {
    setLoadMsg('Gemini AIが解析中...', '文字・数字・金額を読み取っています');
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [
            { inline_data: { mime_type: curMime, data: curB64 } },
            { text: prompt }
          ]
        }]
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'Gemini APIエラー');
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    const clean = text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    parsed.store = store;

    setLoadMsg('スプレッドシートに保存中...', 'Googleスプレッドシートに送信しています');

    // Save to GAS
    let sheetOk = false;
    try {
      const gasRes = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(parsed)
      });
      const gasData = await gasRes.json();
      sheetOk = gasData.status === 'ok';
    } catch(e) { sheetOk = false; }

    // Save locally too
    const d = getData();
    parsed.id = 'r' + Date.now();
    parsed.savedAt = Date.now();
    parsed.sheetSaved = sheetOk;
    d.records.unshift(parsed);
    setData(d);
    updateBadge();

    document.getElementById('load-zone').style.display = 'none';
    showResult(parsed, sheetOk);
    document.getElementById('res-zone').style.display = '';

  } catch(err) {
    document.getElementById('load-zone').style.display = 'none';
    document.getElementById('prev-zone').style.display = '';
    const el = document.getElementById('err-zone');
    el.innerHTML = `<div class="err-box">⚠️ <strong>エラー:</strong> ${err.message}<br><small>APIキーを確認するか、画像を撮り直してください。</small></div>`;
    el.style.display = '';
  }
}

function setLoadMsg(lbl, sub) {
  document.getElementById('load-lbl').textContent = lbl;
  document.getElementById('load-sub').textContent = sub;
}

function fmt(n) {
  if (!n && n !== 0) return '—';
  const num = Number(n);
  if (isNaN(num) || num === 0) return '—';
  return num.toLocaleString('ja-JP');
}

function showResult(d, sheetOk) {
  const items = d.items || [];
  const metaRows = [
    ['店舗', d.store],
    ['仕入先', d.supplier],
    ['納品先', d.buyer],
    ['日付', d.date],
    ['伝票番号', d.invoice_number],
    d.notes ? ['備考', d.notes] : null
  ].filter(r => r && r[1]);

  const itemsHtml = items.length > 0 ? `
    <div class="items-wrap">
      <div class="items-head">明細</div>
      ${items.map(item => `
        <div class="item-row">
          <div>
            <div class="item-name">${item.name || '—'}</div>
            ${(item.quantity || item.unit_price) ? `<div class="item-detail">${item.quantity ? item.quantity + (item.unit||'') : ''} ${item.unit_price ? '× ¥' + fmt(item.unit_price) : ''}</div>` : ''}
          </div>
          <div class="item-amount">${item.amount ? '¥' + fmt(item.amount) : '—'}</div>
        </div>
      `).join('')}
    </div>
  ` : '';

  document.getElementById('res-zone').innerHTML = `
    <div class="result-card">
      <div class="result-head">
        <span class="result-head-lbl">解析結果</span>
        <div style="display:flex; gap:6px;">
          <span class="saved-pill">✓ 保存済み</span>
          ${sheetOk ? '<span class="sheet-pill">📊 シート連携済</span>' : ''}
        </div>
      </div>
      <div class="meta-grid">
        ${metaRows.map(([k,v]) => `<div class="mk">${k}</div><div class="mv">${v}</div>`).join('')}
      </div>
      ${itemsHtml}
      ${d.subtotal && Number(d.subtotal) > 0 ? `<div class="total-row" style="background:transparent;"><span class="total-lbl">小計</span><span style="font-size:15px;">¥${fmt(d.subtotal)}</span></div>` : ''}
      ${d.tax && Number(d.tax) > 0 ? `<div class="total-row" style="background:transparent;"><span class="total-lbl">消費税</span><span style="font-size:15px;">¥${fmt(d.tax)}</span></div>` : ''}
      ${d.total ? `<div class="total-row"><span class="total-lbl">合計金額</span><span class="total-amt">¥${fmt(d.total)}</span></div>` : ''}
    </div>
    <button class="scan-again" onclick="reset()">＋ 別の納品書をスキャン</button>
  `;
}

// ── Records ──
function renderRecs() {
  const { records } = getData();
  const el = document.getElementById('rec-content');
  if (!records.length) {
    el.innerHTML = `<div class="empty"><span class="empty-icon">📋</span><div class="empty-txt">まだデータがありません<br>スキャンタブから読み込んでください</div></div>`;
    return;
  }
  const total = records.reduce((s,r) => s + (Number(r.total)||0), 0);
  const suppliers = new Set(records.map(r=>r.supplier).filter(Boolean)).size;
  el.innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-n">${records.length}</div><div class="stat-l">件数</div></div>
      <div class="stat-card"><div class="stat-n">${suppliers}</div><div class="stat-l">仕入先数</div></div>
      <div class="stat-card"><div class="stat-n sm">¥${total >= 10000 ? (total/10000).toFixed(1)+'万' : fmt(total)}</div><div class="stat-l">合計金額</div></div>
    </div>
    <div class="sec-bar">
      <div class="sec-lbl">${records.length}件</div>
      <button class="mini-btn" onclick="exportCSV()">CSV出力</button>
    </div>
    ${records.map(r => `
      <div class="rec-card">
        <div class="rec-top" onclick="toggleRec('${r.id}')">
          <div style="flex:1;min-width:0;">
            <div class="rec-supplier">${r.supplier||'（仕入先不明）'}<span class="store-tag">${r.store||''}</span></div>
            <div class="rec-meta">${r.date||'日付不明'}${r.invoice_number?' / #'+r.invoice_number:''}${r.sheetSaved?' · 📊':''}
            </div>
          </div>
          <div style="display:flex;align-items:center;">
            ${r.total?`<div class="rec-amt">¥${fmt(r.total)}</div>`:''}
            <div class="rec-chev" id="ch_${r.id}">▼</div>
          </div>
        </div>
        <div class="rec-body" id="rb_${r.id}">
          <div class="rec-items">
            ${(r.items||[]).map(i=>`${i.name||''}${i.quantity?' × '+i.quantity+(i.unit||''):''} ${i.amount?'¥'+fmt(i.amount):''}`).join('<br>')||'明細なし'}
          </div>
          <div class="rec-actions">
            <button class="del-btn" onclick="delRec('${r.id}')">削除</button>
          </div>
        </div>
      </div>
    `).join('')}
  `;
}

function toggleRec(id) {
  document.getElementById('rb_'+id).classList.toggle('open');
  document.getElementById('ch_'+id).classList.toggle('open');
}
function delRec(id) {
  const d = getData(); d.records = d.records.filter(r=>r.id!==id); setData(d);
  updateBadge(); renderRecs(); toast('削除しました');
}

// ── Settings ──
function initSettings() {
  const key = getKey();
  if (key) {
    document.getElementById('gemini-key').value = key;
    document.getElementById('key-ok').style.display = 'block';
  }
  renderStoresList();
  document.getElementById('data-count-lbl').textContent = getData().records.length + '件保存済み';
}

// ── Export ──
function exportCSV() {
  const { records } = getData();
  if (!records.length) { toast('データがありません'); return; }
  const rows = [['店舗','仕入先','納品先','日付','伝票番号','合計金額','品名','数量','単位','単価','金額','保存日時']];
  records.forEach(r => {
    const items = (r.items&&r.items.length) ? r.items : [{}];
    items.forEach((item,i) => {
      rows.push([
        i===0?(r.store||''):'',
        i===0?(r.supplier||''):'',
        i===0?(r.buyer||''):'',
        i===0?(r.date||''):'',
        i===0?(r.invoice_number||''):'',
        i===0?(r.total||''):'',
        item.name||'', item.quantity||'', item.unit||'',
        item.unit_price||'', item.amount||'',
        i===0?new Date(r.savedAt).toLocaleString('ja-JP'):''
      ]);
    });
  });
  const csv = '\uFEFF' + rows.map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download = '納品書データ.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('CSVを出力しました');
}

// ── Toast ──
let toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=>el.classList.remove('show'), 2500);
}

// ── Init ──
renderStoreSelect();
updateBadge();
if (getKey()) document.getElementById('key-ok').style.display = 'block';
</script>
</body>
</html>
